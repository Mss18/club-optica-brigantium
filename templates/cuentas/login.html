{% extends "base.html" %}
{% block titulo %}Iniciar sesión · Club Óptica Brigantium{% endblock %}
{% block contenido %}
<section class="container py-5" style="max-width:440px">
  <h1 class="h3 mb-4">Iniciar sesión</h1>
  {% if form.errors %}
    <div class="alert alert-danger">El usuario o la contraseña no son correctos.</div>
  {% endif %}
  <form method="post" class="needs-validation" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_username" class="form-label">Usuario</label>
      <input type="text" name="username" id="id_username" class="form-control" required autofocus>
      <div class="invalid-feedback">Introduzca su usuario.</div>
    </div>
    <div class="mb-3">
      <label for="id_password" class="form-label">Contraseña</label>
      <input type="password" name="password" id="id_password" class="form-control" required>
      <div class="invalid-feedback">Introduzca su contraseña.</div>
    </div>
    <button class="btn btn-primary w-100">Entrar</button>
  </form>
</section>
{% endblock %}
