{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block contenido %}
  <h1>Entrar</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Entrar</button>
  </form>
  <p class="mt-3">¿No tienes cuenta? <a href="{% url 'registro' %}">Crear cuenta</a></p>
{% endblock %}
