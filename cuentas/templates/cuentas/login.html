{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block contenido %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card">
        <div class="card-body p-4">
          <h1 class="h4 mb-4">Entrar</h1>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
          </form>
        </div>
      </div>
      <p class="mt-3 text-center">¿No tienes cuenta? <a href="{% url 'registro' %}">Crear cuenta</a></p>
    </div>
  </div>
{% endblock %}
