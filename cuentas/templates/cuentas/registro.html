{% extends "base.html" %}

{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
  <h1>Crear cuenta</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Registrarme</button>
  </form>
  <p class="mt-3">¿Ya tienes cuenta? <a href="{% url 'login' %}">Entrar</a></p>
{% endblock %}
