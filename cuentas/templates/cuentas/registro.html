{% extends "base.html" %}

{% block titulo %}Crear cuenta{% endblock %}

{% block contenido %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card">
        <div class="card-body p-4">
          <h1 class="h4 mb-4">Crear cuenta</h1>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <p class="small">
              <a href="{% url 'privacidad' %}" target="_blank" rel="noopener">Leer la política de privacidad</a>
            </p>
            <button type="submit" class="btn btn-primary w-100">Registrarme</button>
          </form>
        </div>
      </div>
      <p class="mt-3 text-center">¿Ya tienes cuenta? <a href="{% url 'login' %}">Entrar</a></p>
    </div>
  </div>
{% endblock %}
